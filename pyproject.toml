[project]
name = "github-crawler-agent"
version = "0.1.0"
description = "Standalone GitHub Crawler Agent practice project using CrewAI"
requires-python = ">=3.10,<=3.13"

dependencies = [
    "crewai[litellm]>=0.80.0",
    "crewai-tools>=0.14.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[project.scripts]
run_crew = "github_crawler_agent.main:run"